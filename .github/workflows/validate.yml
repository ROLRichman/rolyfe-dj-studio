name: Validate DJ Studio
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate entry point and controller layouts
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          if (!/<title>RO’Lyfe DJ Studio<\/title>/.test(html)) throw new Error('Missing page title');
          for (const label of ['Classic Dual Deck', 'Club Pro', 'Battle / Scratch', 'Minimal Performance']) {
            if (!html.includes(label)) throw new Error('Missing controller layout: ' + label);
          }
          const match = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!match) throw new Error('Missing application script');
          new Function(match[1]);
          console.log('HTML entry point, all four layouts, and JavaScript syntax passed.');
          NODE
